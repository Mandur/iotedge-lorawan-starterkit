name: LoRa Build & Test CI
on: # rebuild any PRs and main branch changes
  pull_request:
    branches:
      - master
      - dev
    paths-ignore:
      - 'Docs/**'
      - 'Arduino/**'
      - 'Samples/**'
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  buildConfiguration: 'Release'
  AZURE_FUNCTIONAPP_NAME: loramoduleintegrationtest
  TESTS_FOLDER: Tests
  TESTS_RESULTS_FOLDER: Tests/TestResults

jobs:
  build_and_test:
    name: Build and Test Solution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      name: Checkout current branch

    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: .NET SDK Information
      run: dotnet --info

    - name: Restore Tools
      run: dotnet tool restore

    - name: Refresh T4 Generated Code
      # Re-run all T4 templates to refresh them.
      run: git ls-files *.tt | xargs -t -n 1 dotnet t4

    - name: Check for Modifications
      # "git diff" with "--exit-code" makes the program exit with codes similar to diff.
      # That is, it exits with 1 if there were differences and 0 means no differences.
      # This is to ensure that the last step did not introduce any changes to the working
      # tree, which would mean that the tracked generated code is not up to date with the
      # template. The templates should be executed on a local clone (either using VS or
      # via "dotnet t4") and the (refreshed) generated code committed.
      run: git diff --exit-code

    # build LoRa Engine
    - name: Build LoRa Engine
      run: dotnet build --configuration ${{ env.buildConfiguration }}

    # build C# Samples/DecoderSample
    - name: Build C# Samples/DecoderSample
      run: dotnet build --configuration ${{ env.buildConfiguration }} Samples/DecoderSample

    # Run unit tests
    - name: Run unit tests
      run: |
        dotnet test --configuration ${{ env.buildConfiguration }} --no-build \
          --logger trx --results-directory  ${{ env.TESTS_RESULTS_FOLDER }}/Unit \
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:ExcludeByFile="**/${{ env.TESTS_FOLDER }}/" \
          ${{ env.TESTS_FOLDER }}/Unit/LoRaWan.Tests.Unit.csproj

    # Pull Redis Cache docker image
    - name: Pulling Redis Cache image
      run: docker pull redis:6.0-alpine

    # Run integration tests
    - name: Run integration tests
      run: |
        dotnet test --configuration ${{ env.buildConfiguration }} --no-build \
          --logger trx --results-directory ${{ env.TESTS_RESULTS_FOLDER }}/Integration \
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:ExcludeByFile="**/${{ env.TESTS_FOLDER }}/" \
          ${{ env.TESTS_FOLDER }}/Integration/LoRaWan.Tests.Integration.csproj

    # Run cli tests
    - name: Run cli unit tests
      run: |
        dotnet test --configuration ${{ env.buildConfiguration }} \
          --logger trx --results-directory ${{ env.TESTS_RESULTS_FOLDER }}/Cli.Unit \
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:ExcludeByFile="**/${{ env.TESTS_FOLDER }}/" \
          ./Tools/Cli-LoRa-Device-Provisioning/Tests/LoRaWan.Tools.CLI.Tests.Unit/LoRaWan.Tools.CLI.Tests.Unit.csproj


    # Upload test results as artifact
    - uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: test-results
        path: |
          ${{ env.TESTS_RESULTS_FOLDER }}/Unit
          ${{ env.TESTS_RESULTS_FOLDER }}/Integration
          ${{ env.TESTS_RESULTS_FOLDER }}/Cli.Unit

    - name: Upload to Codecov test reports
      uses: codecov/codecov-action@v7
      with:
        directory: Tests/
        use_oidc: true

  build_docker_images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    concurrency:
      group: ci-keyvault-runner-access
      cancel-in-progress: false
    environment:
      name: CI
    steps:
    - name: Az CLI login
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - uses: actions/checkout@v7
      name: Checkout current branch

    - name: Allow runner IP in Key Vault firewall
      id: keyvault_firewall
      shell: bash
      env:
        KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
      run: |
        set -euo pipefail
        runner_ip="$(curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 --ipv4 https://api.ipify.org)"
        python3 -c 'import ipaddress, sys; ipaddress.IPv4Address(sys.argv[1])' "$runner_ip"
        cidr="$runner_ip/32"
        rules="$(az keyvault show --name "$KEYVAULT_NAME" --query 'properties.networkAcls.ipRules[].value' -o tsv)"
        if ! grep -Fxq -e "$runner_ip" -e "$cidr" <<< "$rules"; then
          # Record cleanup before the update in case the request succeeds but its response is lost.
          echo "runner_cidr=$cidr" >> "$GITHUB_OUTPUT"
          az keyvault network-rule add --name "$KEYVAULT_NAME" --ip-address "$cidr" --output none
        fi
        az keyvault update --name "$KEYVAULT_NAME" --default-action Deny --bypass None --public-network-access Enabled --output none
        access="$(az keyvault show --name "$KEYVAULT_NAME" --query properties.publicNetworkAccess -o tsv)"
        if [[ "$access" != Enabled ]]; then
          echo "Key Vault public access is still disabled. Check for an inherited Azure policy before retrying." >&2
          exit 1
        fi
        for attempt in {1..18}; do
          if error="$(az keyvault secret show --vault-name "$KEYVAULT_NAME" --name CI-ACR-NAME --query id --output none 2>&1)"; then
            exit 0
          fi
          if [[ "$error" != *ForbiddenByFirewall* && "$error" != *ForbiddenByRbac* ]]; then
            printf '%s\n' "$error" >&2
            exit 1
          fi
          if [[ "$attempt" == 18 ]]; then
            printf 'Key Vault access did not propagate: %s\n' "$error" >&2
            exit 1
          fi
          sleep 10
        done

    - name: Read Secrets from keyvault
      uses: ./.github/actions/read_keyvault
      with:
        KEY_ARRAY: ('CI-ACR-NAME', 'CI-ACR-CREDENTIALS')
        KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}

    - uses: docker/setup-buildx-action@v4
      id: buildx

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Build docker images
      run: |
        echo $CI_ACR_CREDENTIALS | docker login "$CI_ACR_NAME.azurecr.io" --username "$CI_ACR_NAME" --password-stdin
        CONTAINER_REGISTRY_ADDRESS=$CI_ACR_NAME.azurecr.io docker buildx bake --allow=fs.read=.. --set *.args.CONTAINER_REGISTRY_ADDRESS=${{ env.CI_ACR_NAME }}.azurecr.io
      working-directory: LoRaEngine

    - name: Remove runner IP from Key Vault firewall
      if: ${{ always() && steps.keyvault_firewall.outputs.runner_cidr != '' }}
      shell: bash
      env:
        KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
        RUNNER_CIDR: ${{ steps.keyvault_firewall.outputs.runner_cidr }}
      run: |
        set -euo pipefail
        az keyvault network-rule remove --name "$KEYVAULT_NAME" --ip-address "$RUNNER_CIDR" --output none
        rules="$(az keyvault show --name "$KEYVAULT_NAME" --query 'properties.networkAcls.ipRules[].value' -o tsv)"
        if grep -Fxq -e "$RUNNER_CIDR" -e "${RUNNER_CIDR%/32}" <<< "$rules"; then
          echo "Runner IP is still present in the Key Vault firewall." >&2
          exit 1
        fi
