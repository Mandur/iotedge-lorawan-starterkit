name: LoRa Build & Test CI
on: # rebuild any PRs and main branch changes
  pull_request:
    branches:
      - master
      - dev
    paths-ignore:
      - 'Docs/**'
      - 'Arduino/**'
      - 'Samples/**'
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      RunE2ETestsOnly:
        description: 'Run E2E tests only'
        default: false
      TestsToRun:
        default: '[\"SensorDecodingTest\",\"OTAAJoinTest\",\"ABPTest\",\"OTAATest\",\"MacTest\",\"ClassCTest\",\"C2DMessageTest\",\"MultiGatewayTest\"]'
        description: 'tests to run'
env:
  buildConfiguration: 'Release'
  AZURE_FUNCTIONAPP_NAME: loramoduleintegrationtest
  TESTS_FOLDER: Tests
  TESTS_RESULTS_FOLDER: Tests/TestResults

jobs:
  build_and_test:
    name: Build and Test Solution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      name: Checkout current branch

    - name: .NET SDK Information
      run: dotnet --info

    - name: Restore Tools
      run: dotnet tool restore

    - name: Refresh T4 Generated Code
      # Re-run all T4 templates to refresh them.
      run: git ls-files *.tt | xargs -t -n 1 dotnet t4

    - name: Check for Modifications
      # "git diff" with "--exit-code" makes the program exit with codes similar to diff.
      # That is, it exits with 1 if there were differences and 0 means no differences.
      # This is to ensure that the last step did not introduce any changes to the working
      # tree, which would mean that the tracked generated code is not up to date with the
      # template. The templates should be executed on a local clone (either using VS or
      # via "dotnet t4") and the (refreshed) generated code committed.
      run: git diff --exit-code

    # build LoRa Engine
    - name: Build LoRa Engine
      run: dotnet build --configuration ${{ env.buildConfiguration }}

    # build C# Samples/DecoderSample
    - name: Build C# Samples/DecoderSample
      run: dotnet build --configuration ${{ env.buildConfiguration }} Samples/DecoderSample

    # Run unit tests
    - name: Run unit tests
      run: |
        dotnet test --configuration ${{ env.buildConfiguration }} --no-build \
          --logger trx -r ${{ env.TESTS_RESULTS_FOLDER }}/Unit \
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:ExcludeByFile="**/${{ env.TESTS_FOLDER }}/" \
          ${{ env.TESTS_FOLDER }}/Unit/LoRaWan.Tests.Unit.csproj

    # Pull Redis Cache docker image
    - name: Pulling Redis Cache image
      run: docker pull redis:5.0.4-alpine

    # Run integration tests
    - name: Run integration tests
      run: |
        dotnet test --configuration ${{ env.buildConfiguration }} --no-build \
          --logger trx -r ${{ env.TESTS_RESULTS_FOLDER }}/Integration \
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:ExcludeByFile="**/${{ env.TESTS_FOLDER }}/" \
          ${{ env.TESTS_FOLDER }}/Integration/LoRaWan.Tests.Integration.csproj

    # Upload test results as artifact
    - uses: actions/upload-artifact@v2
      if: success() || failure()
      with:
        name: test-results
        path: |
          ${{ env.TESTS_RESULTS_FOLDER }}/Unit
          ${{ env.TESTS_RESULTS_FOLDER }}/Integration

    - name: Upload to Codecov test reports
      uses: codecov/codecov-action@v2
      with:
        directory: Tests/


  # Deploy IoT Edge solution to ARM gateway
  deploy_arm_gw_iot_edge:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        gateway: [ primary, secondary ]
        include:
          - gateway: primary
            architecture: arm32v7
          - gateway: secondary
            architecture: arm32v7
    if: needs.env_var.outputs.RunE2ETestsOnly != 'true'
    env:
      CONTAINER_REGISTRY_ADDRESS: "loramoduleintegrationtest.azurecr.io"
      CONTAINER_REGISTRY_SERVER: "loramoduleintegrationtest.azurecr.io"
      CONTAINER_REGISTRY_USERNAME: "loramoduleintegrationtest"
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.ACR_CREDENTIALS }}
      IOTHUB_CONNECTION_STRING: ${{ secrets.IOTHUB_CONNECTION_STRING }}
      IOT_EDGE_DEPLOYMENT_ID: "citest${{ matrix.gateway }}"
      NET_SRV_LOG_LEVEL: 1
      NET_SRV_LOGTO_HUB: false
      NET_SRV_LOGTO_UDP: true
      NET_SRV_IOTEDGE_TIMEOUT: 0
      NET_SRV_LOG_TO_UDP_ADDRESS: "itestup"
      EDGEHUB_ROUTE: "FROM /* INTO $upstream"
      RESET_PIN: 7
      REGION: "EU"
      FACADE_SERVER_URL: "https://${{ needs.env_var.outputs.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/"
      FACADE_AUTH_CODE: ${{ secrets.FUNCTION_AUTH_CODE }}
      EDGE_AGENT_VERSION: 1.2.2
      EDGE_HUB_VERSION: 1.2.2
      EDGEHUB_OPTIMIZEFORPERFORMANCE: false
      EDGEHUB_MQTTSETTINGS_ENABLED: false
      EDGEHUB_HTTPSETTINGS_ENABLED: false
      BUILD_BUILDID: ${{ github.run_id }}
      DEV_IMAGE_TAG: dev
      DEVICE_ID: ${{ matrix.gateway }}
      MASTER_IMAGE_TAG: master
    runs-on: ubuntu-latest
    name: Run IoT Edge Deployment on ARM gateway
    steps:
      - uses: actions/checkout@v2
        name: Checkout current branch

      - run: |
          if [ ${{ github.ref	}} = "refs/heads/dev" ]; then
          echo "dev"
          IMAGE_TAG="$DEV_IMAGE_TAG"
          elif [ ${{ github.ref	}} = "refs/heads/master" ]; then
          echo "master"
          IMAGE_TAG="$MASTER_IMAGE_TAG"
          elif [ ${{ github.event_name }} == "pull_request" ]; then
          echo "pull request"
          IMAGE_TAG="pr-${{ github.event.number}}"
          else
          echo "all others"
          IMAGE_TAG="custom-${GITHUB_REF##*/}"
          fi
          echo "Using image tag prefix $IMAGE_TAG"
          IMAGE_TAG="$IMAGE_TAG-${{ github.run_number }}"
          echo "Using image tag $IMAGE_TAG"
          echo "::set-env name=NET_SRV_VERSION::$IMAGE_TAG"
          echo "::set-env name=PKT_FWD_VERSION::$IMAGE_TAG"
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
